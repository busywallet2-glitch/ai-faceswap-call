# Busywallet balanced starter profile
# Use only with a FaceFusion release whose configuration schema matches these keys.
# Start conservative; raise pixel boost only after measuring GPU memory and speed.

[processors]
face_swapper_model = hyperswap_1a_256
face_swapper_pixel_boost = 128x128
face_swapper_weight = 0.5

[face_landmarker]
face_landmarker_model = 2dfan4
face_landmarker_score = 0.5

[face_selector]
face_selector_mode = reference
face_selector_order = large-small
face_selector_age_start =
face_selector_age_end =
reference_face_position = 0
reference_face_distance = 0.3
reference_frame_number = 0

[execution]
execution_device_ids = 0
execution_providers =
execution_thread_count = 4

[memory]
video_memory_strategy = strict

[benchmark]
benchmark_mode = warm
benchmark_resolutions = 240p 360p
benchmark_cycle_count = 5

[misc]
log_level = info
halt_on_error = False
