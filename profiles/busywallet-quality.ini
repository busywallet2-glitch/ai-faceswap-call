# Busywallet quality-first starter profile
# Requires a compatible, adequately provisioned GPU and matching model/runtime licences.
# Higher pixel boost can sharply increase memory use and reduce frame rate.

[processors]
face_swapper_model = hyperswap_1a_256
face_swapper_pixel_boost = 512x512
face_swapper_weight = 0.85

[face_landmarker]
face_landmarker_model = 2dfan4
face_landmarker_score = 0.65

[face_selector]
face_selector_mode = reference
face_selector_order = large-small
face_selector_age_start =
face_selector_age_end =
reference_face_position = 0
reference_face_distance = 0.3
reference_frame_number = 0

[execution]
execution_device_ids = 0
execution_providers =
execution_thread_count = 8

[memory]
video_memory_strategy = moderate

[benchmark]
benchmark_mode = warm
benchmark_resolutions = 360p 540p 720p
benchmark_cycle_count = 5

[misc]
log_level = info
halt_on_error = True
