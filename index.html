
<script type="module">
  import {
    FaceLandmarker,
    FilesetResolver
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

  const video = document.getElementById("camera");
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");
  const status = document.getElementById("status");

  const faceFile = document.getElementById("faceFile");
  const facePreview = document.getElementById("facePreview");
  const permission = document.getElementById("permission");

  let stream = null;
  let landmarker = null;
  let running = false;
  let lastDetection = 0;
  let uploadedFace = false;

  async function loadTracker() {
    try {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      landmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });

      status.textContent = "Facial tracking engine ready.";
    } catch (error) {
      status.textContent =
        "Could not load tracking. Check your internet and reload.";
      console.error(error);
    }
  }

  function drawFaceOverlay(points) {
    if (!uploadedFace || !permission.checked || !facePreview.complete) {
      return false;
    }

    const xs = points.map(point => (1 - point.x) * canvas.width);
    const ys = points.map(point => point.y * canvas.height);

    const left = Math.min(...xs);
    const right = Math.max(...xs);
    const top = Math.min(...ys);
    const bottom = Math.max(...ys);

    const width = right - left;
    const height = bottom - top;

    if (width <= 0 || height <= 0) return false;

    ctx.save();

    ctx.beginPath();
    ctx.ellipse(
      left + width / 2,
      top + height / 2,
      width * 0.48,
      height * 0.48,
      0,
      0,
      Math.PI * 2
    );
    ctx.clip();

    ctx.drawImage(
      facePreview,
      left,
      top,
      width,
      height
    );

    ctx.restore();
    return true;
  }

  function trackFace() {
    if (!running) return;

    if (video.readyState >= 2 && landmarker) {
      const now = performance.now();

      if (now - lastDetection > 66) {
        lastDetection = now;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        try {
          const result = landmarker.detectForVideo(video, now);
          const faces = result.faceLandmarks;

          if (faces && faces.length > 0) {
            const points = faces[0];
            const overlayDrawn = drawFaceOverlay(points);

            if (overlayDrawn) {
              status.textContent = "Authorized face overlay active.";
            } else {
              ctx.fillStyle = "#9d8cff";

              for (const point of points) {
                ctx.beginPath();
                ctx.arc(
                  (1 - point.x) * canvas.width,
                  point.y * canvas.height,
                  1.5,
                  0,
                  Math.PI * 2
                );
                ctx.fill();
              }

              status.textContent =
                "Face detected. Tracking facial movements.";
            }
          } else {
            status.textContent = "Looking for a face...";
          }
        } catch (error) {
          status.textContent = "Tracking error. Restart the camera.";
          console.error(error);
        }
      }
    }

    requestAnimationFrame(trackFace);
  }

  document.getElementById("start").addEventListener("click", async () => {
    if (!landmarker) {
      status.textContent = "Tracker is still loading. Please wait.";
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      running = true;
      requestAnimationFrame(trackFace);

      status.textContent = "Camera started.";
    } catch (error) {
      status.textContent =
        "Camera access failed. Please allow camera permission.";
      console.error(error);
    }
  });

  document.getElementById("stop").addEventListener("click", () => {
    running = false;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    status.textContent = "Camera stopped.";
  });

  faceFile.addEventListener("change", event => {
    const file = event.target.files[0];

    if (!file) return;

    uploadedFace = false;
    facePreview.hidden = true;

    const imageUrl = URL.createObjectURL(file);

    facePreview.onload = () => {
      uploadedFace = true;
      facePreview.hidden = false;
      status.textContent = permission.checked
        ? "Authorized face image loaded."
        : "Image loaded. Confirm permission before using the overlay.";
      URL.revokeObjectURL(imageUrl);
    };

    facePreview.onerror = () => {
      status.textContent = "Could not load that image. Try another photo.";
      URL.revokeObjectURL(imageUrl);
    };

    facePreview.src = imageUrl;
  });

  permission.addEventListener("change", () => {
    status.textContent = permission.checked
      ? "Permission confirmed."
      : "Face overlay disabled until permission is confirmed.";
  });

  loadTracker();
</script>
