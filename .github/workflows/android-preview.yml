name: Build Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # Skip the action's obsolete default package list; install packages explicitly below.
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          rsync -av ./ www/ \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/android/' \
            --exclude '/node_modules/' \
            --exclude '/tests/' \
            --exclude '/www/' \
            --exclude '*.md' \
            --exclude 'package*.json' \
            --exclude 'capacitor.config.*'

      - name: Generate Android project
        run: npx cap add android

      - name: Add camera and microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text(encoding='utf-8')
          match = re.search(r'<manifest\\b[^>]*>', source)
          if match is None:
              raise SystemExit("Android manifest opening tag was not found.")

          permissions = (
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          )
          missing = [
              f'    <uses-permission android:name="{permission}" />'
              for permission in permissions
              if f'android:name="{permission}"' not in source
          ]
          if missing:
              insertion = "\\n" + "\\n".join(missing) + "\\n"
              source = source[:match.end()] + insertion + source[match.end():]
              manifest.write_text(source, encoding='utf-8')
          PY
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Busywallet-AI-Face-Swap-Android-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
